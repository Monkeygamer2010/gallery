# PhoneAgent fork: builds the "ci" APK on every push to the working branches and publishes it to a
# rolling pre-release, replaced on each run: "phoneagent-ci" for the main build branch (MAIN_BRANCH
# below) only, "phoneagent-ci-sync" for every other branch (upstream syncs), so a branch build never
# replaces the main APK. Both are signed with the owner's key from the repository secrets, in one
# step that alone sees them; an APK signed with anything else is never published.
name: Build PhoneAgent APK

on:
  push:
    branches: ["claude/phone-agent**", "upstream-sync-**"]
    # Pushes that only change docs/ or Markdown files skip the build. Everything else builds,
    # including this workflow and the privacy checks; Markdown under Android/src (skill files
    # packaged in the APK) builds too. A later pattern overrides an earlier one.
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "Android/src/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The branch whose builds are the owner's main APK (pre-release "phoneagent-ci").
  MAIN_BRANCH: claude/phone-agent-ik31nz
  # SHA-256 of the owner's signing certificate (public; docs/DECISIONS.md, "Signing"). The publish
  # job refuses an APK signed with any other certificate. Change it only when the key changes.
  RELEASE_CERT_SHA256: "9A:A9:A0:CF:36:8E:49:CA:81:24:10:DE:5C:EC:F1:31:2D:9E:78:C2:12:E8:45:DE:D9:4C:7D:EB:5A:5E:D5:57"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      # "release" when the APK was signed with the key from the secrets, else "throwaway".
      signed: ${{ steps.sign.outputs.signed }}
      cert_sha256: ${{ steps.cert.outputs.sha256 }}
    defaults:
      run:
        working-directory: Android/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pick the pre-release
        id: release
        run: |
          if [ "$GITHUB_REF" = "refs/heads/$MAIN_BRANCH" ]; then tag=phoneagent-ci; else tag=phoneagent-ci-sync; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishes to: $tag"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      # Unit tests of the privacy rules themselves: the guard rejects each library upstream would
      # bring in, the APK check finds excluded upstream code and assets, the permission set,
      # intent filters and package-visibility entries are exact.
      - name: Privacy rule tests
        run: ./gradlew --no-daemon -p build-logic test

      # Fails on forbidden dependencies (Firebase, Play services, Play Core, ML Kit, AICore,
      # analytics SDKs), local file dependencies, a stale license list and on MediaPipe references
      # the telemetry stub doesn't cover. Prints every library + license.
      - name: Privacy guard
        run: ./gradlew --no-daemon :app:privacyGuard

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest :telemetry-stub:testDebugUnitTest

      # Gradle gets no secret: it signs with a throwaway debug key, and the signing step below
      # re-signs the APK with the owner's key.
      - name: Build ci APK
        run: ./gradlew --no-daemon :app:assembleCi

      # assembleCi also runs checkCiApk: forbidden classes, classes and assets of the excluded
      # upstream features, native network imports, leftover debug logging and merged-manifest
      # rules (exact permissions, intent filters, queries). Both checks write a report only when they ran and
      # passed, so a check that was skipped or switched off cannot look like a pass.
      - name: Verify privacy reports
        run: |
          for r in app/build/reports/phoneagent/privacy-guard.txt app/build/reports/phoneagent/apk-check-ci.txt; do
            test -f "$r" || { echo "::error::missing $r"; exit 1; }
            head -n 1 "$r" | grep -qx PASSED || { echo "::error::$r did not pass"; cat "$r"; exit 1; }
          done
          cat app/build/reports/phoneagent/apk-check-ci.txt

      # The only step that sees the signing secrets. It decodes the keystore into a private temp
      # folder, re-signs the APK with apksigner and deletes the keystore again, whatever happens.
      # Nothing it prints contains a secret. Without the secrets the APK keeps the throwaway key:
      # the run still compiles and tests everything, but publishes nothing.
      - name: Sign with the owner's key
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Signing secrets not set:$missing. This APK keeps the throwaway debug key and is not published."
            echo "signed=throwaway" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/signing"
          (umask 077 && mkdir -p "$dir")
          trap 'rm -rf "$dir"' EXIT
          if ! printf '%s' "$KEYSTORE_B64" | base64 -d > "$dir/release.keystore" 2> /dev/null || [ ! -s "$dir/release.keystore" ]; then
            echo "::error::Signing failed: KEYSTORE_B64 is not base64 text of a keystore file."
            exit 1
          fi
          apk=app/build/outputs/apk/ci/app-ci.apk
          # Scheme v2 only, as Gradle signs (minSdk 31 needs no v1 JAR signature).
          if ! "$ANDROID_HOME/build-tools/37.0.0/apksigner" sign --ks "$dir/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false \
            --v4-signing-enabled false --out "$dir/signed.apk" "$apk" > "$dir/apksigner.log" 2>&1; then
            # Say which secret looks wrong without printing apksigner's output, which can quote values.
            reason="the keystore could not be used; check all four signing secrets"
            if grep -qi "keystore password was incorrect" "$dir/apksigner.log"; then
              reason="KEYSTORE_PASSWORD does not open the keystore"
            elif grep -qiE "no key with alias|does not contain|alias not found|key entry not found" "$dir/apksigner.log"; then
              reason="the keystore has no key under KEY_ALIAS (look for a stray space or line break)"
            elif grep -qiE "UnrecoverableKey|key password|Cannot recover key|Get Key failed" "$dir/apksigner.log"; then
              reason="KEY_PASSWORD does not unlock the key"
            elif grep -qiE "Invalid keystore format|DerInputStream|Unrecognized keystore|toDerInputStream" "$dir/apksigner.log"; then
              reason="KEYSTORE_B64 does not decode to a keystore"
            fi
            echo "::error::Signing failed: $reason."
            exit 1
          fi
          mv "$dir/signed.apk" "$apk"
          echo "signed=release" >> "$GITHUB_OUTPUT"
          echo "Signed with the owner's key."

      # Verifies the APK's signature and prints its certificate's SHA-256 (public, never a secret).
      - name: Signing certificate
        id: cert
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          apk=app/build/outputs/apk/ci/app-ci.apk
          certs=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk")
          digests=$(printf '%s\n' "$certs" | grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $4}' | sort -u)
          if [ "$(printf '%s\n' "$digests" | grep -c .)" != 1 ]; then
            echo "::error::The APK must be signed by exactly one certificate."
            exit 1
          fi
          sha=$(printf '%s' "$digests" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Signing certificate SHA-256: $sha ($SIGNED key)"
          if [ "$SIGNED" = release ] && [ "$sha" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::The secrets hold another key: the APK's certificate is not the expected $RELEASE_CERT_SHA256."
            exit 1
          fi

      # Only an APK signed with the owner's key leaves the job.
      - name: Collect APK
        if: steps.sign.outputs.signed == 'release'
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/ci/app-ci.apk "$RUNNER_TEMP/apk/PhoneAgent-ci.apk"
          (cd "$RUNNER_TEMP/apk" && sha256sum PhoneAgent-ci.apk > PhoneAgent-ci.apk.sha256)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.sign.outputs.signed == 'release'
        with:
          name: phoneagent-ci-apk
          path: ${{ runner.temp }}/apk/
          if-no-files-found: error
          retention-days: 14

      # The signing step deletes the keystore itself; this also runs when a step failed or the
      # job was cancelled, and in the temp folder, so it works even if the checkout never ran.
      - name: Remove decoded keystore
        if: always()
        working-directory: ${{ runner.temp }}
        run: rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/ci.keystore"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      # A push to our branches publishes only an APK signed with the owner's key.
      - name: Require the owner's key
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
          CERT: ${{ needs.build.outputs.cert_sha256 }}
        run: |
          if [ "$SIGNED" != release ]; then
            echo "::error::Not publishing: the signing secrets are not set, so this APK carries a throwaway debug key. Set KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
            exit 1
          fi
          if [ "$CERT" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::Not publishing: the APK's signing certificate is $CERT, not the expected $RELEASE_CERT_SHA256."
            exit 1
          fi
          echo "Publishing an APK signed with certificate SHA-256 $CERT."

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phoneagent-ci-apk
          path: apk

      - name: Replace the rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          CERT: ${{ needs.build.outputs.cert_sha256 }}
        run: |
          case "$TAG" in phoneagent-ci|phoneagent-ci-sync) ;; *) echo "::error::unexpected tag $TAG"; exit 1 ;; esac
          notes="Automatic build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Not a release.
          Install: download PhoneAgent-ci.apk and open it on the phone (package suffix .dev).
          SHA-256: $(cut -d' ' -f1 apk/PhoneAgent-ci.apk.sha256)
          Signing certificate SHA-256: ${CERT}"
          title="PhoneAgent CI build (${GITHUB_SHA::7})"
          if [ "$TAG" = phoneagent-ci-sync ]; then
            notes="Branch build, not the main build (that is the phoneagent-ci pre-release).
          $notes"
            title="PhoneAgent branch build ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          fi
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" apk/PhoneAgent-ci.apk apk/PhoneAgent-ci.apk.sha256 \
            --prerelease --target "$GITHUB_SHA" \
            --title "$title" --notes "$notes"
